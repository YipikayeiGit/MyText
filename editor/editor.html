<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>MyText</title>
<meta name="mytext-version" content="1.0.10">
<style>
  :root{
    --bg:#e6e8ec; --bar:#ffffff; --line:#d5d9e0; --ink:#1f2430; --muted:#6b7280;
    --accent:#2f6fde; --hover:#eef2f8; --page:#ffffff; --activo:#dfe8fb;
  }
  body.oscuro{
    --bg:#1b1e24; --bar:#262a32; --line:#3a3f4a; --ink:#e6e8ec; --muted:#9aa1ad;
    --hover:#30353f; --page:#2b2f37; --activo:#34405a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}

  /* Barra de menú */
  .menu{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .titulo{font-weight:600;margin-right:10px;display:flex;align-items:center;gap:8px}
  .titulo input{border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:3px 6px;border-radius:4px;width:220px}
  .titulo input:hover,.titulo input:focus{border-color:var(--line);outline:none}
  .desplegable{position:relative}
  .desplegable>button{background:none;border:none;color:var(--ink);font:inherit;padding:5px 10px;border-radius:4px;cursor:pointer}
  .desplegable>button:hover,.desplegable.abierto>button{background:var(--hover)}
  .opciones{display:none;position:absolute;top:100%;left:0;min-width:250px;background:var(--bar);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:4px;z-index:50}
  .desplegable.abierto .opciones{display:block}
  .opciones button{display:flex;justify-content:space-between;gap:14px;width:100%;text-align:left;background:none;border:none;color:var(--ink);font:inherit;font-size:14px;padding:7px 10px;border-radius:4px;cursor:pointer}
  .opciones button:hover{background:var(--hover)}
  .opciones kbd{color:var(--muted);font-family:inherit;font-size:12px}
  .opciones hr{border:none;border-top:1px solid var(--line);margin:4px 0}

  /* Barra de herramientas */
  .herramientas{display:flex;align-items:center;gap:2px;padding:5px 10px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .herramientas button,.herramientas select,.herramientas label.color{height:30px;min-width:30px;border:1px solid transparent;background:none;color:var(--ink);border-radius:4px;cursor:pointer;font:inherit;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
  .herramientas button:hover,.herramientas label.color:hover{background:var(--hover)}
  .herramientas button.activo{background:var(--activo);border-color:var(--line)}
  .herramientas select{border-color:var(--line);background:var(--page);padding:0 4px}
  .sep{width:1px;height:22px;background:var(--line);margin:0 5px}
  label.color{position:relative;flex-direction:column;gap:0}
  label.color input{position:absolute;opacity:0;width:0;height:0}
  label.color .barrita{width:16px;height:3px;border-radius:1px;margin-top:-2px}

  /* Cuerpo: índice + documento */
  .cuerpo{flex:1;display:flex;min-height:0}
  #indice{width:250px;flex-shrink:0;background:var(--bar);border-right:1px solid var(--line);overflow:auto;padding:12px 8px}
  #indice.oculto{display:none}
  #indice h4{margin:2px 8px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  #indice h4 button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
  #indice a{display:block;padding:5px 8px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.3;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #indice a:hover{background:var(--hover)}
  #indice a.actual{background:var(--activo);font-weight:600}
  #indice a.n1{font-weight:600}
  #indice a.n2{padding-left:20px}
  #indice a.n3{padding-left:34px;color:var(--muted)}
  #indice .vacio{color:var(--muted);font-size:13px;padding:4px 8px;line-height:1.45}

  .zona{flex:1;overflow:auto;padding:30px 20px 60px}
  .envoltorio{margin:0 auto}
  .documento{position:relative;display:flow-root;width:210mm;transform-origin:top left}
  .pagina{position:absolute;left:0;width:100%;background:var(--page);box-shadow:0 1px 4px rgba(0,0,0,.18);pointer-events:none}
  .pagina .num{position:absolute;bottom:10mm;left:0;right:0;text-align:center;font-size:9pt;color:var(--muted)}

  #editor{position:relative;z-index:1;outline:none;margin:25mm 22mm 0;min-height:247mm;font-family:Calibri,Carlito,"Segoe UI",sans-serif;font-size:12pt;line-height:1.5;word-wrap:break-word;color:var(--ink)}
  #editor:empty:before{content:"Empieza a escribir o abre un archivo…";color:var(--muted)}
  #editor p{margin:0 0 .6em}
  #editor h1,#editor h2,#editor h3{margin:.6em 0 .4em;line-height:1.25}
  #editor h1::before,#editor h2::before,#editor h3::before{user-select:none}
  #indice a .nt{color:var(--muted);margin-right:6px;font-weight:600}
  #editor table{border-collapse:collapse;width:100%;margin:.5em 0}
  #editor td,#editor th{border:1px solid #999;padding:5px 8px;min-width:40px;vertical-align:top}
  #editor img{max-width:100%;cursor:pointer}
  #editor img.arrastrando{opacity:.45;pointer-events:none}
  #marcoImg{position:absolute;z-index:20;border:1.5px solid var(--accent);pointer-events:none;display:none}
  #marcoImg.visible{display:block}
  #marcoImg .asa{position:absolute;width:11px;height:11px;background:#fff;border:1.5px solid var(--accent);border-radius:2px;pointer-events:auto}
  #marcoImg .asa[data-a=nw]{left:-6px;top:-6px;cursor:nwse-resize}
  #marcoImg .asa[data-a=n]{left:calc(50% - 6px);top:-6px;cursor:ns-resize}
  #marcoImg .asa[data-a=ne]{right:-6px;top:-6px;cursor:nesw-resize}
  #marcoImg .asa[data-a=e]{right:-6px;top:calc(50% - 6px);cursor:ew-resize}
  #marcoImg .asa[data-a=se]{right:-6px;bottom:-6px;cursor:nwse-resize}
  #marcoImg .asa[data-a=s]{left:calc(50% - 6px);bottom:-6px;cursor:ns-resize}
  #marcoImg .asa[data-a=sw]{left:-6px;bottom:-6px;cursor:nesw-resize}
  #marcoImg .asa[data-a=w]{left:-6px;top:calc(50% - 6px);cursor:ew-resize}
  #marcoImg .medida{position:absolute;right:0;bottom:-24px;background:var(--accent);color:#fff;font:11px system-ui,sans-serif;padding:2px 6px;border-radius:3px;white-space:nowrap}
  #barraImg{position:absolute;z-index:21;display:none;gap:3px;align-items:center;background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:4px 6px;white-space:nowrap;font:13px system-ui,sans-serif}
  #barraImg.visible{display:flex}
  #barraImg button{height:28px;min-width:28px;border:1px solid transparent;background:none;color:var(--ink);border-radius:4px;cursor:pointer;font:inherit;padding:0 6px}
  #barraImg button:hover{background:var(--hover)}
  #barraImg button.activo{background:var(--activo);border-color:var(--line)}
  #barraImg select,#barraImg input{height:28px;border:1px solid var(--line);border-radius:4px;background:var(--page);color:var(--ink);font:inherit}
  #barraImg input{width:56px;padding:0 4px}
  #barraImg .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
  #cursorSoltar{position:fixed;width:2px;background:var(--accent);z-index:99;pointer-events:none;display:none}
  #recorte{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:95;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  #recorte.visible{display:flex}
  #recorteZona{position:relative;user-select:none;line-height:0}
  #recorteZona img{display:block;max-width:85vw;max-height:72vh;pointer-events:none}
  #recorteCaja{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;outline:1px dashed rgba(0,0,0,.6);outline-offset:-3px}
  #recorteZona{overflow:hidden}
  #recorteCaja .asa{position:absolute;width:14px;height:14px;background:#fff;border-radius:2px}
  #recorteCaja .asa[data-a=nw]{left:-8px;top:-8px;cursor:nwse-resize}
  #recorteCaja .asa[data-a=n]{left:calc(50% - 7px);top:-8px;cursor:ns-resize}
  #recorteCaja .asa[data-a=ne]{right:-8px;top:-8px;cursor:nesw-resize}
  #recorteCaja .asa[data-a=e]{right:-8px;top:calc(50% - 7px);cursor:ew-resize}
  #recorteCaja .asa[data-a=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
  #recorteCaja .asa[data-a=s]{left:calc(50% - 7px);bottom:-8px;cursor:ns-resize}
  #recorteCaja .asa[data-a=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}
  #recorteCaja .asa[data-a=w]{left:-8px;top:calc(50% - 7px);cursor:ew-resize}
  #recorte .botones{display:flex;gap:8px}
  #recorte .botones button{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font:14px system-ui,sans-serif;background:#fff;color:#222}
  #recorte .botones button.prim{background:var(--accent);color:#fff}
  #recorte .ayuda{color:#ddd;font:13px system-ui,sans-serif}
  #editor a{color:var(--accent)}
  #editor blockquote{margin:0 0 .6em 40px}
  #editor pre{font-family:"Courier New",monospace;font-size:10.5pt;white-space:pre-wrap;background:rgba(127,127,127,.08);padding:8px;border-radius:4px}
  #editor .salto-pagina{display:block;height:16px;margin:4px 0;border-top:1px dashed var(--line);user-select:none;cursor:default}
  #editor .salto-pagina::before{content:"Salto de página";display:block;text-align:center;font-size:8pt;color:var(--muted);font-family:system-ui,sans-serif;line-height:16px}
  @media screen{ #editor .empuje{margin-top:var(--empuje)!important} }
  body.brocha #editor{cursor:copy}

  /* Barra de estado */
  .estado{display:flex;gap:18px;align-items:center;padding:4px 14px;background:var(--bar);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .estado .der{margin-left:auto;display:flex;align-items:center;gap:8px}
  .estado input[type=range]{width:110px}

  /* Buscar y reemplazar */
  #buscador{display:none;position:fixed;top:110px;right:24px;background:var(--bar);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:12px;z-index:60;width:300px}
  #buscador.visible{display:block}
  #buscador input[type=text]{width:100%;padding:6px 8px;margin-bottom:6px;border:1px solid var(--line);border-radius:4px;background:var(--page);color:var(--ink);font:inherit}
  #buscador .fila{display:flex;gap:6px;flex-wrap:wrap}
  #buscador button{flex:1;padding:6px;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:4px;cursor:pointer;font:inherit;font-size:13px}
  #buscador button:hover{background:var(--hover)}
  #buscador .info{font-size:12px;color:var(--muted);margin-top:6px}
  mark.encontrado{background:#ffe26a;color:#000}
  mark.encontrado.actual{background:#ff9d2e}

  #aviso{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;max-width:90%;text-align:center}
  #aviso.visible{opacity:1}
  #cargando{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;align-items:center;justify-content:center;color:#fff;font-size:16px}
  #cargando.visible{display:flex}
  /* ===== Visor de PDF ===== */
  #visorPdf{flex:1;display:none;flex-direction:column;min-width:0;background:#525659}
  body.modo-pdf #visorPdf{display:flex}
  body.modo-pdf .zona, body.modo-pdf .herramientas, body.modo-pdf #indice, body.modo-pdf #cuentaPalabras, body.modo-pdf #cuentaCaracteres, body.modo-pdf #estadoGuardado, body.modo-pdf .estado .der{display:none!important}
  .vbarra{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
  .vbarra button{height:32px;min-width:32px;border:1px solid transparent;background:none;color:var(--ink);border-radius:5px;cursor:pointer;font:inherit;padding:0 8px}
  .vbarra button:hover{background:var(--hover)}
  .vbarra button.prim{background:var(--accent);color:#fff}
  .vbarra button.prim:hover{filter:brightness(1.08)}
  .vbarra button.activo{background:var(--activo);border-color:var(--line)}
  .vbarra .vnombre{font-weight:600;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 6px}
  .vbarra .hueco{flex:1}
  .vbarra .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  #vpZoom{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
  #vpEdicion{display:none;align-items:center;gap:4px}
  body.pdf-editando #vpEdicion{display:flex}
  body.pdf-editando #vpEditar, body.pdf-editando #vpConvertir{display:none}
  .vayuda{display:none;background:#fff7d6;color:#5a4a00;padding:6px 12px;font-size:13px;border-bottom:1px solid #e8d98a}
  body.pdf-editando .vayuda{display:block}
  .vpaginas{flex:1;overflow:auto;padding:20px 10px 60px}
  .vpagina{position:relative;margin:0 auto 16px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  .vpagina canvas{position:absolute;left:0;top:0;display:block}
  .vpagina .vcargando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px}
  .textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
  .textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
  .textLayer ::selection{background:rgba(0,90,255,.3)}
  .capaEdicion{position:absolute;inset:0;z-index:3}
  body.pdf-anadiendo .capaEdicion{cursor:crosshair}
  .vlinea{position:absolute;white-space:pre;line-height:1.15;color:transparent;outline:none;border-radius:2px;cursor:text;padding:0 1px;caret-color:#000}
  .vlinea:hover{box-shadow:0 0 0 1px rgba(47,111,222,.7);background:rgba(47,111,222,.06)}
  .vlinea:focus,.vlinea.editada{color:#000;background:#fff;box-shadow:0 0 0 1.5px var(--accent)}
  .vlinea.editada:not(:focus){box-shadow:0 0 0 1px rgba(47,111,222,.35)}
  .vlinea.nueva{min-width:40px}
  @media (max-width: 820px){ .vbarra .vnombre{flex-basis:100%;max-width:none;margin:0 0 2px} .vpaginas{padding:10px 4px 40px} }
  @media print{
    body.modo-pdf .vbarra, body.modo-pdf .vayuda{display:none!important}
    body.modo-pdf #visorPdf{display:block!important;background:#fff}
    body.modo-pdf .vpaginas{overflow:visible;padding:0}
    body.modo-pdf .vpagina{box-shadow:none;margin:0;break-after:page;page-break-after:always}
    body.modo-pdf .vlinea{box-shadow:none!important}
  }



  /* ===== Vista móvil (texto a todo el ancho, sin hojas) ===== */
  body.vista-movil .zona{padding:0;background:var(--page)}
  body.vista-movil #editor img[data-ajuste=izq],body.vista-movil #editor img[data-ajuste=der]{max-width:50%;height:auto!important}
  @media (pointer:coarse){ .opciones kbd{display:none} }
  body.vista-movil .envoltorio{width:auto!important;height:auto!important}
  body.vista-movil .documento{width:auto;height:auto!important;transform:none!important}
  body.vista-movil .pagina{display:none}
  body.vista-movil #editor{margin:0;padding:20px 18px 45vh;min-height:100%;background:var(--page)}
  body.vista-movil #editor blockquote{margin-left:20px}
  #fondoIndice{display:none}
  #editor img{-webkit-touch-callout:none}
  #editor img.sel{touch-action:none}
  #marcoImg .asa,#recorteCaja,#recorteCaja .asa{touch-action:none}
  @media (pointer:coarse){
    #marcoImg .asa{transform:scale(1.8)}
    #recorteCaja .asa{transform:scale(1.5)}
    .herramientas button,.herramientas label.color{min-width:38px;height:38px}
    .opciones button{padding:11px 12px;font-size:15px}
  }
  @media (max-width: 820px){
    html,body{height:100%;height:100dvh}
    .menu{padding:4px 6px;gap:0}
    .titulo{flex-basis:100%;margin:0 0 2px}
    .titulo input{flex:1;width:auto;min-width:0}
    .desplegable>button{padding:7px 10px;font-size:15px}
    .opciones{position:fixed;left:8px;right:8px;min-width:0;max-height:70vh;overflow:auto}
    .herramientas{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 6px}
    .herramientas::-webkit-scrollbar{display:none}
    .herramientas > *{flex-shrink:0}
    .herramientas select{font-size:16px;height:36px}
    #indice{position:fixed;top:0;bottom:0;left:0;z-index:75;width:82vw;max-width:310px;box-shadow:4px 0 20px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .2s;display:block!important}
    #indice.movil-abierto{transform:none}
    #fondoIndice.visible{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:74}
    #indice a{padding:10px 8px;font-size:15px}
    .estado{gap:12px;padding:5px 10px}
    #cuentaCaracteres,#estadoGuardado,.estado .der{display:none!important}
    #buscador{top:8px;left:8px;right:8px;width:auto}
    #buscador input[type=text]{font-size:16px}
    #barraImg{flex-wrap:wrap;white-space:normal;max-width:calc(100% - 8px);row-gap:4px}
    #barraImg select,#barraImg input{font-size:16px}
    #recorteZona img{max-width:94vw;max-height:62vh}
    #recorte .botones{flex-wrap:wrap;justify-content:center}
    #aviso{bottom:60px}
  }

  /* ===== Programa de escritorio ===== */
  #bannerAct{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:#2f6fde;color:#fff;font-size:14px}
  #bannerAct.visible{display:flex}
  #bannerAct button{border:none;border-radius:5px;padding:5px 12px;cursor:pointer;font:inherit}
  #bannerAct .prim{background:#fff;color:#2f6fde;font-weight:600}
  #bannerAct .sec{background:rgba(255,255,255,.18);color:#fff}
  #bannerAct .cerrar{margin-left:auto;background:none;color:#fff;font-size:16px}
  #listaRecientes .titulo-rec{font-size:12px;color:var(--muted);padding:6px 10px 2px}
  #listaRecientes button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:330px}
  @page{size:A4;margin:25mm 22mm}
  @media print{
    .menu,.herramientas,.estado,#buscador,#aviso,#indice,.pagina{display:none!important}
    html,body{height:auto;overflow:visible;background:#fff}
    .cuerpo,.zona{display:block;padding:0;overflow:visible}
    .envoltorio{width:auto!important;height:auto!important}
    .documento{width:auto;transform:none!important}
    #editor{margin:0;min-height:0;color:#000}
    #editor .salto-pagina{height:0;margin:0;border:none;break-after:page;page-break-after:always}
    #editor .salto-pagina::before{display:none}
  }
</style>
</head>
<body>

<div class="menu">
  <div class="titulo">📝 <input id="nombreDoc" value="Documento sin título" title="Nombre del documento"></div>

  <div class="desplegable">
    <button>Archivo</button>
    <div class="opciones">
      <button data-accion="nuevo">Nuevo <kbd>Ctrl+Alt+N</kbd></button>
      <button data-accion="abrir">Abrir… <kbd>Ctrl+O</kbd></button>
      <hr>
      <button data-accion="guardar" class="solo-web">Guardar <kbd>Ctrl+S</kbd></button>
      <button data-accion="guardar-como" class="solo-web">Guardar como… <kbd>Ctrl+Mayús+S</kbd></button>
      <hr class="solo-web">
      <button data-accion="guardar-docx">Guardar como Word (.docx)</button>
      <button data-accion="guardar-doc">Guardar como Word 97-2003 (.doc)</button>
      <button data-accion="guardar-odt">Guardar como OpenDocument (.odt)</button>
      <button data-accion="guardar-rtf">Guardar como texto enriquecido (.rtf)</button>
      <button data-accion="guardar-pdf">Guardar como PDF</button>
      <button data-accion="guardar-html">Guardar como HTML</button>
      <button data-accion="guardar-txt">Guardar como texto (.txt)</button>
      <button data-accion="guardar-md">Guardar como Markdown (.md)</button>
      <hr>
      <button data-accion="imprimir">Imprimir <kbd>Ctrl+P</kbd></button>
    </div>
  </div>

  <div class="desplegable">
    <button>Editar</button>
    <div class="opciones">
      <button data-cmd="undo">Deshacer <kbd>Ctrl+Z</kbd></button>
      <button data-cmd="redo">Rehacer <kbd>Ctrl+Y</kbd></button>
      <hr>
      <button data-accion="copiar">Copiar <kbd>Ctrl+C</kbd></button>

<script>
// Dónde se guarda el documento abierto (en el programa, cada ventana usa las suyas)
const CLAVE = {contenido: 'editor-contenido', nombre: 'editor-nombre', estado: 'mytext-estado', recarga: 'mytext-recargando'};
const editor = document.getElementById('editor');
const nombreDoc = document.getElementById('nombreDoc');
const $ = id => document.getElementById(id);
const CDN = {
  pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfjsWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  html2pdf: 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js',
  pdflib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'
};

/* ================= utilidades ================= */
function aviso(msg, ms = 2800){
  const a = $('aviso'); a.textContent = msg; a.classList.add('visible');
  clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove('visible'), ms);
}
function cargando(si, texto = 'Cargando…'){ $('cargando').textContent = texto; $('cargando').classList.toggle('visible', si); }
function escapar(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function textoAHtml(t){
  return t.replace(/\r\n?/g,'\n').split(/\n{2,}/).map(p => '<p>' + escapar(p).replace(/\n/g,'<br>') + '</p>').join('');
}
// Alineación: pulsar la que ya tiene el párrafo la quita (vuelve a la izquierda), como en Word
const ALINEACIONES = {justifyLeft: '', justifyCenter: 'center', justifyRight: 'right', justifyFull: 'justify'};
const normalAlin = v => (v === 'center' || v === 'right' || v === 'justify') ? v : (v === 'end' ? 'right' : '');
function alinearParrafos(c){
  let bloques = parrafosSeleccion();
  if (!bloques.length){ document.execCommand('formatBlock', false, '<p>'); bloques = parrafosSeleccion(); }
  if (!bloques.length) return;
  let objetivo = ALINEACIONES[c];
  if (objetivo && bloques.every(b => normalAlin(getComputedStyle(b).textAlign) === objetivo)) objetivo = '';
  bloques.forEach(b => {
    // Si la alineación viene de un contenedor, se pasa a sus párrafos para poder cambiar solo este
    let a = b.parentElement;
    while (a && a !== editor){
      if (a.style.textAlign){
        const heredada = a.style.textAlign; a.style.textAlign = '';
        a.querySelectorAll(SELECTOR_PARRAFO).forEach(h => { if (!h.style.textAlign && !h.querySelector(SELECTOR_PARRAFO)) h.style.textAlign = heredada; });
        if (!a.getAttribute('style')) a.removeAttribute('style');
      }
      a = a.parentElement;
    }
    b.style.textAlign = objetivo;
    b.removeAttribute('align');
    if (!b.getAttribute('style')) b.removeAttribute('style');
  });
  actualizar(); estadoBotones();
}
function cmd(c, v = null){
  const sa = getSelection();
  if (!sa.rangeCount || !editor.contains(sa.anchorNode)) restaurarSeleccion(); else editor.focus();
  const t = tituloEnSeleccion();
  if (t && aplicarATitulo(t.tagName.toLowerCase(), c, v)) return;
  if (ALINEACIONES[c] !== undefined){ alinearParrafos(c); return; }
  document.execCommand(c, false, v);
  if (c === 'formatBlock' || c === 'insertHTML') limpiarTitulos();
  actualizar();
}
function nombreBase(){ return (nombreDoc.value.trim() || 'documento').replace(/[\\/:*?"<>|]/g,'_'); }
async function descargar(contenido, nombre, tipo){
  const blob = contenido instanceof Blob ? contenido : new Blob([contenido], {type: tipo});
  if (destinoHandle){
    const h = destinoHandle; destinoHandle = null;
    try {
      await escribirEnArchivo(h, blob);
      aviso('Guardado en "' + h.name + '" ✓');
      $('estadoGuardado').textContent = 'Guardado a las ' + new Date().toLocaleTimeString('es-ES', {hour: '2-digit', minute: '2-digit'}) + ' en "' + h.name + '"';
      return true;
    } catch(e){
      if (e && e.name === 'AbortError') return false;
      alert('No se pudo guardar en "' + h.name + '".\n\n' + (e && e.message || e) + '\n\nSe descargará una copia en la carpeta Descargas.');
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  aviso('Se ha descargado una copia: ' + nombre + ' (carpeta Descargas)', 4500);
  return true;
}
const cargados = {};
function cargarScript(src){
  if (cargados[src]) return cargados[src];
  return cargados[src] = new Promise((ok, mal) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = ok; s.onerror = () => { delete cargados[src]; mal(new Error('No se pudo cargar una librería necesaria. ¿Hay conexión a internet?')); };
    document.head.appendChild(s);
  });
}

/* ================= estilos de título (como en Word) ================= */
const ESTILOS_DEF = {
  h1: {font:'', size:20, color:'', bold:true, italic:false, underline:false, align:''},
  h2: {font:'', size:16, color:'', bold:true, italic:false, underline:false, align:''},
  h3: {font:'', size:14, color:'', bold:true, italic:false, underline:false, align:''}
};
const NOMBRE_NIVEL = {h1:'Título 1', h2:'Título 2', h3:'Título 3'};
const TAM_SELECT = {1:8, 2:10, 3:12, 4:14, 5:18, 6:24, 7:36};
let estilos = JSON.parse(JSON.stringify(ESTILOS_DEF));
let numerarTitulos = true, estilosGuardados = false;
try {
  const e = JSON.parse(localStorage.getItem('editor-estilos') || 'null');
  if (e && e.h1){ estilos = {...estilos, ...e}; estilosGuardados = true; }
  if (localStorage.getItem('editor-numerar') === '0') numerarTitulos = false;
} catch(e){}

const hojaTitulos = document.createElement('style'); document.head.appendChild(hojaTitulos);
function cssNivel(s){
  return `font-size:${s.size}pt;font-weight:${s.bold ? 700 : 400};font-style:${s.italic ? 'italic' : 'normal'};text-decoration:${s.underline ? 'underline' : 'none'};` +
    (s.color ? `color:${s.color};` : '') + (s.font ? `font-family:"${s.font}";` : '') + (s.align ? `text-align:${s.align};` : '');
}
function cssTitulos(scope, contadores){
  let c = ['h1','h2','h3'].map(l => `${scope} ${l}{${cssNivel(estilos[l])}}`).join('');
  if (contadores && numerarTitulos){
    c += `${scope}{counter-reset:t1 t2 t3}` +
      `${scope} h1{counter-increment:t1;counter-set:t2 0 t3 0}${scope} h2{counter-increment:t2;counter-set:t3 0}${scope} h3{counter-increment:t3}` +
      `${scope} h1::before{content:counter(t1) ".\\00a0\\00a0"}` +
      `${scope} h2::before{content:counter(t1) "." counter(t2) "\\00a0\\00a0"}` +
      `${scope} h3::before{content:counter(t1) "." counter(t2) "." counter(t3) "\\00a0\\00a0"}`;
  }
  return c;
}
function aplicarEstilos(guardar = true){
  hojaTitulos.textContent = cssTitulos('#editor', true);
  $('txtNumerar').textContent = 'Numerar títulos: ' + (numerarTitulos ? 'sí' : 'no');
  if (guardar){ guardarPref('editor-estilos', JSON.stringify(estilos)); guardarPref('editor-numerar', numerarTitulos ? '1' : '0'); estilosGuardados = true; }
  if (typeof paginarPronto === 'function'){ paginarPronto(); clearTimeout(aplicarEstilos.t); aplicarEstilos.t = setTimeout(actualizarIndice, 50); }
}
// Número de cada título (1., 1.1, 1.1.1…)
function numerosTitulos(raiz){
  const m = new Map(), c = [0, 0, 0];
  raiz.querySelectorAll('h1,h2,h3').forEach(h => {
    const n = +h.tagName[1] - 1;
    c[n]++; for (let i = n + 1; i < 3; i++) c[i] = 0;
    m.set(h, n === 0 ? c[0] + '.' : c.slice(0, n + 1).join('.'));
  });
  return m;
}
function tituloEnSeleccion(){
  const s = getSelection(); if (!s.rangeCount) return null;
  const el = n => n && (n.nodeType === 3 ? n.parentElement : n);
  const a = el(s.anchorNode), f = el(s.focusNode);
  if (!a || !editor.contains(a)) return null;
  const ta = a.closest('h1,h2,h3'), tf = f && f.closest('h1,h2,h3');
  if (!ta || !editor.contains(ta)) return null;
  if (!s.isCollapsed && (!tf || tf.tagName !== ta.tagName)) return null;
  return ta;
}
function aplicarATitulo(nivel, c, v){
  const s = estilos[nivel];
  switch (c){
    case 'bold': s.bold = !s.bold; break;
    case 'italic': s.italic = !s.italic; break;
    case 'underline': s.underline = !s.underline; break;
    case 'foreColor': s.color = v; break;
    case 'fontName': s.font = v; break;
    case 'fontSize': s.size = TAM_SELECT[v] || s.size; break;
    case 'justifyLeft': s.align = ''; break;
    case 'justifyCenter': s.align = s.align === 'center' ? '' : 'center'; break;
    case 'justifyRight': s.align = s.align === 'right' ? '' : 'right'; break;
    case 'justifyFull': s.align = s.align === 'justify' ? '' : 'justify'; break;
    case 'removeFormat': estilos[nivel] = {...ESTILOS_DEF[nivel]}; break;
    case 'insertOrderedList': case 'insertUnorderedList':
      if (!numerarTitulos){ numerarTitulos = true; aplicarEstilos(); }
      aviso('Los títulos se numeran solos (1., 1.1, 2.…). Puedes quitarlo en Ver → Numerar títulos.', 4500);
      return true;
    default: return false;
  }
  aplicarEstilos();
  limpiarTitulos();
  estadoBotones();
  aviso(`Formato aplicado a todos los «${NOMBRE_NIVEL[nivel]}»`);
  return true;
}
// Los títulos no llevan formato propio: lo toman de su estilo
const FORMATO_INLINE = new Set(['SPAN','FONT','B','STRONG','I','EM','U','S','STRIKE','DEL','INS']);
function limpiarTitulos(){
  // Sacar los títulos de listas (p. ej. <ol><li><h1>)
  editor.querySelectorAll(':scope > ol, :scope > ul').forEach(lista => {
    if (!lista.querySelector('h1,h2,h3')) return;
    const salida = []; let actual = null;
    [...lista.children].forEach(li => {
      const hs = li.querySelector('h1,h2,h3');
      if (hs){ actual = null; salida.push(...[...li.childNodes].filter(n => n.nodeType === 1 || n.nodeValue.trim())); }
      else { if (!actual){ actual = document.createElement(lista.tagName); salida.push(actual); } actual.appendChild(li); }
    });
    salida.forEach(n => { if (n.nodeType === 3){ const p = document.createElement('p'); p.appendChild(n); n = p; } lista.before(n); });
    lista.remove();
  });
  editor.querySelectorAll('h1,h2,h3').forEach(h => {
    const lh = h.style.lineHeight, mb = h.style.marginBottom;
    h.removeAttribute('style'); h.removeAttribute('align');
    if (lh) h.style.lineHeight = lh;
    if (mb) h.style.marginBottom = mb;
    h.querySelectorAll('*').forEach(n => {
      if (FORMATO_INLINE.has(n.tagName) && !n.classList.contains('encontrado')) n.replaceWith(...n.childNodes);
      else if (n.tagName !== 'MARK') n.removeAttribute('style');
    });
    h.normalize();
  });
}
// Si un documento ya traía títulos con formato propio, lo adopta como estilo del nivel
// forzar = true: al abrir un archivo, los títulos toman el formato que traen en el archivo
function adoptarFormatoTitulos(forzar = false){
  if (!forzar && estilosGuardados) return;
  let cambio = false;
  ['h1','h2','h3'].forEach(l => {
    const h = [...editor.querySelectorAll(l)].find(h => h.getAttribute('style') || h.querySelector('span[style],font,b,strong,i,em,u'));
    if (!h) return;
    const tw = document.createTreeWalker(h, NodeFilter.SHOW_TEXT); let t;
    while ((t = tw.nextNode()) && !t.nodeValue.trim());
    const cs = getComputedStyle(t ? t.parentElement : h);
    const s = estilos[l];
    const hex = aHex(cs.color);
    if (hex && hex !== '1F2430' && hex !== 'E6E8EC' && hex !== '000000') s.color = '#' + hex.toLowerCase();
    else if (forzar) s.color = '';
    const fuente = primeraFuente(cs.fontFamily);
    if (fuente && !/calibri|carlito|segoe/i.test(fuente)) s.font = fuente; else if (forzar) s.font = '';
    if (forzar){ const al = h.style.textAlign; s.align = al === 'center' ? 'center' : al === 'right' ? 'right' : al === 'justify' ? 'justify' : ''; }
    s.size = Math.round(parseFloat(cs.fontSize) * 0.75 * 2) / 2 || s.size;

/* Interlineado: se aplica a los párrafos seleccionados */
const SELECTOR_PARRAFO = 'p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,td,th,div:not(#editor):not(.salto-pagina)';
function parrafosSeleccion(){
  const s = getSelection(); if (!s.rangeCount || !editor.contains(s.anchorNode)) return [];
  const r = s.getRangeAt(0), lista = [];
  const propio = n => { const el = n.nodeType === 3 ? n.parentElement : n; const b = el && el.closest(SELECTOR_PARRAFO); return b && editor.contains(b) ? b : null; };
  [propio(r.startContainer), propio(r.endContainer)].forEach(b => b && lista.push(b));
  editor.querySelectorAll(SELECTOR_PARRAFO).forEach(b => { if (r.intersectsNode(b) && !b.querySelector(SELECTOR_PARRAFO)) lista.push(b); });
  return [...new Set(lista)];
}
function aplicarInterlineado(v){
  restaurarSeleccion();
  let bloques = parrafosSeleccion();
  if (!bloques.length){ document.execCommand('formatBlock', false, '<p>'); bloques = parrafosSeleccion(); }
  bloques.forEach(b => {
    if (v.startsWith('esp:')) b.style.marginBottom = v.slice(4);
    else b.style.lineHeight = v;
    if (!b.getAttribute('style')) b.removeAttribute('style');
  });
  actualizar(); estadoBotones();
  aviso(v.startsWith('esp:') ? 'Espacio entre párrafos cambiado' : 'Interlineado: ' + v.replace('.', ','));
}
$('interlineado').addEventListener('change', e => { const v = e.target.value; e.target.value = ''; if (v) aplicarInterlineado(v); });
function mostrarInterlineado(){
  const b = parrafosSeleccion()[0];
  const lh = b ? (b.style.lineHeight || (b.closest('[style*="line-height"]') || {style:{}}).style.lineHeight) : '';
  $('interlineado').querySelector('option[value=""]').textContent = '↕ ' + (lh ? String(+lh || lh).replace('.', ',') : '1,5');
  $('interlineado').value = '';
}

function estadoBotones(){

/* Copia limpia del contenido (sin marcas internas del editor) */
function limpioParaExportar(conNumeros = false, paraGuardar = false){
  const c = editor.cloneNode(true);
  c.querySelectorAll('img').forEach(i => { i.classList.remove('arrastrando', 'sel'); if (!i.getAttribute('class')) i.removeAttribute('class'); if (!paraGuardar){ delete i.dataset.original; delete i.dataset.recorte; } });

  c.querySelectorAll('mark.encontrado').forEach(m => m.replaceWith(...m.childNodes));
  c.querySelectorAll('.empuje').forEach(quitarEmpuje);
  c.querySelectorAll('.salto-pagina').forEach(s => { s.removeAttribute('contenteditable'); s.setAttribute('style', 'page-break-after:always;break-after:page'); });
  return c.innerHTML;

/* ================= paginación visual ================= */
const MM = 96 / 25.4;
const PAG_H = 297 * MM, MARGEN_V = 25 * MM, HUECO = 28;
const CONT_H = PAG_H - 2 * MARGEN_V, PASO = PAG_H + HUECO;
const documento = $('documento'), envoltorio = $('envoltorio');
let escala = 1, numPaginas = 1;

function quitarEmpuje(el){
  el.classList.remove('empuje'); el.style.removeProperty('--empuje');
  if (!el.getAttribute('style')) el.removeAttribute('style');
  if (!el.getAttribute('class')) el.removeAttribute('class');
}
function posY(el){
  let y = 0, n = el;
  while (n && n !== editor){ y += n.offsetTop; n = n.offsetParent; }
  if (n !== editor) return el.getBoundingClientRect().top / escala - editor.getBoundingClientRect().top / escala;
  return y;
}
function empujar(el, destino){
  const actual = posY(el);
  const mt = parseFloat(getComputedStyle(el).marginTop) || 0;
  let v = mt + (destino - actual);
  el.classList.add('empuje'); el.style.setProperty('--empuje', v + 'px');
  const resto = destino - posY(el);              // corrige el colapso de márgenes
  if (Math.abs(resto) > 0.5){ v += resto; el.style.setProperty('--empuje', v + 'px'); }
}
function paginar(){
  if (document.body.classList.contains('vista-movil')){
    editor.querySelectorAll('.empuje').forEach(quitarEmpuje);
    numPaginas = 1; $('cuentaPaginas').textContent = '';
    if (typeof colocarMarco === 'function') colocarMarco();
    return;
  }
  editor.querySelectorAll('.empuje').forEach(quitarEmpuje);
  const unidades = [];
  for (const el of editor.children){
    if (el.tagName === 'UL' || el.tagName === 'OL'){ for (const li of el.children) unidades.push(li); }
    else unidades.push(el);
  }
  let saltoPendiente = null;
  for (const el of unidades){
    if (el.classList.contains('salto-pagina')){ saltoPendiente = el; continue; }
    const top = posY(el);
    let alto = el.offsetHeight;
    if (el.querySelectorAll) el.querySelectorAll('img').forEach(i => { if (i.style.float) alto = Math.max(alto, posY(i) + i.offsetHeight - top); });
    const pag = Math.floor(top / PASO), finCont = pag * PASO + CONT_H;
    let destino = null;
    if (saltoPendiente){
      const d = (Math.floor(posY(saltoPendiente) / PASO) + 1) * PASO;
      if (top < d) destino = d;
      saltoPendiente = null;
    } else if (top >= finCont - 1){
      destino = (pag + 1) * PASO;                 // empieza dentro del margen: a la página siguiente
    } else if (top + alto > finCont + 1 && alto <= CONT_H && top > pag * PASO + 1){
      destino = (pag + 1) * PASO;                 // no cabe entero: a la página siguiente
    }
    if (destino !== null) empujar(el, destino);
  }
  const total = Math.max(editor.offsetHeight, 1);
  numPaginas = Math.max(1, Math.floor((total - 1) / PASO) + 1);
  if (saltoPendiente) numPaginas = Math.max(numPaginas, Math.floor(posY(saltoPendiente) / PASO) + 2);
  dibujarPaginas();
}
function dibujarPaginas(){
  const hojas = documento.querySelectorAll('.pagina');
  for (let i = hojas.length; i < numPaginas; i++){
    const p = document.createElement('div'); p.className = 'pagina';
    p.style.top = (i * PASO) + 'px'; p.style.height = PAG_H + 'px';
    p.innerHTML = `<div class="num">${i + 1}</div>`;
    documento.insertBefore(p, editor);
  }
  for (let i = numPaginas; i < hojas.length; i++) hojas[i].remove();
  documento.style.height = (numPaginas * PASO - HUECO) + 'px';
  ajustarEscala();
  paginaActual();
  if (typeof colocarMarco === 'function') colocarMarco();
}
function ajustarEscala(){
  envoltorio.style.width = (documento.offsetWidth * escala) + 'px';
  envoltorio.style.height = (documento.offsetHeight * escala) + 'px';
}
function paginaActual(){
  const z = $('zona').getBoundingClientRect();
  const y = (z.top + z.height / 3 - documento.getBoundingClientRect().top) / escala;
  const p = Math.min(numPaginas, Math.max(1, Math.floor(y / PASO) + 1));
  if (!document.body.classList.contains('vista-movil')) $('cuentaPaginas').textContent = `Página ${p} de ${numPaginas}`;
}
let rafPag = 0;
function paginarPronto(){ cancelAnimationFrame(rafPag); rafPag = requestAnimationFrame(paginar); }

/* Salto de página (Ctrl+Intro) */
function bloqueRaiz(n){
  while (n && n.parentNode !== editor) n = n.parentNode;
  return n;
}
function estaVacio(el){ return !el.textContent.replace(/​/g,'').trim() && !el.querySelector('img,table,hr'); }
function insertarSalto(){
  restaurarSeleccion();
  const s = getSelection(); if (!s.rangeCount) return;
  const r = s.getRangeAt(0); r.deleteContents();
  const salto = document.createElement('div'); salto.className = 'salto-pagina'; salto.contentEditable = 'false';
  let nuevo;
  let bloque = bloqueRaiz(r.startContainer === editor ? editor.childNodes[r.startOffset] || editor.lastChild : r.startContainer);
  if (!bloque || bloque.nodeType === 3 || ['TABLE','HR'].includes(bloque.tagName) || bloque.classList.contains('salto-pagina')){
    nuevo = document.createElement('p'); nuevo.innerHTML = '<br>';
    if (bloque && bloque.nodeType === 3){ const p = document.createElement('p'); bloque.replaceWith(p); p.appendChild(bloque); bloque = p; }
    if (bloque) bloque.after(salto, nuevo); else editor.append(salto, nuevo);
  } else {
    const r2 = document.createRange();
    r2.setStart(r.startContainer, r.startOffset); r2.setEnd(bloque, bloque.childNodes.length);
    const resto = r2.extractContents();
    nuevo = document.createElement(/^H\d$/.test(bloque.tagName) ? 'p' : bloque.tagName);
    if (bloque.getAttribute('style')) nuevo.setAttribute('style', bloque.getAttribute('style'));
    nuevo.appendChild(resto);
    if (estaVacio(nuevo)) nuevo.innerHTML = nuevo.tagName === 'UL' || nuevo.tagName === 'OL' ? '<li><br></li>' : '<br>';
    if (estaVacio(bloque) && !(bloque.tagName === 'UL' || bloque.tagName === 'OL')) bloque.innerHTML = '<br>';
    bloque.after(salto, nuevo);
  }
  const destino = nuevo.tagName === 'UL' || nuevo.tagName === 'OL' ? nuevo.querySelector('li') || nuevo : nuevo;
  const nr = document.createRange(); nr.setStart(destino, 0); nr.collapse(true);
  s.removeAllRanges(); s.addRange(nr);
  actualizar();
  requestAnimationFrame(() => { const sel = getSelection(); if (sel.rangeCount){ const el = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement; el.scrollIntoView({block:'center'}); } });
}

/* ================= copiar formato (brocha) ================= */
let formatoCopiado = null, brochaFija = false;
const btnBrocha = $('btnBrocha');
btnBrocha.addEventListener('click', () => { clearTimeout(btnBrocha.t); btnBrocha.t = setTimeout(() => empezarBrocha(false), 230); });
btnBrocha.addEventListener('dblclick', () => { clearTimeout(btnBrocha.t); empezarBrocha(true); });

function elementoEnCursor(){
  const s = getSelection(); if (!s.rangeCount) return null;
  let n = s.anchorNode;
  if (!s.isCollapsed){ const r = s.getRangeAt(0); n = r.startContainer; if (n.nodeType === 1 && n.childNodes[r.startOffset]) n = n.childNodes[r.startOffset]; }
  const el = n && (n.nodeType === 3 ? n.parentElement : n);
  return el && editor.contains(el) ? el : null;
}
function fondoDe(el){
  while (el && el !== editor){
    const b = getComputedStyle(el).backgroundColor;
    if (b && b !== 'transparent' && !/rgba\(.*,\s*0\)$/.test(b) && !el.matches('mark.encontrado')) return b;
    el = el.parentElement;
  }
  return null;
}
function empezarBrocha(fija){
  if (formatoCopiado){
    const s = getSelection();
    if (rangoGuardado && !rangoGuardado.collapsed && (!s.rangeCount || !editor.contains(s.anchorNode))) restaurarSeleccion();

  if (s.isCollapsed) return;
  const q = c => { try { return document.queryCommandState(c); } catch(e){ return false; } };

  const actualBloque = (document.queryCommandValue('formatBlock') || 'p').toLowerCase().replace(/[<>]/g,'');

  ['bold','italic','underline','strikeThrough','superscript','subscript'].forEach(c => { if (q(c) !== f[c]) document.execCommand(c); });
  document.execCommand('fontName', false, f.fuente);
  document.execCommand('foreColor', false, f.color);
  document.execCommand('hiliteColor', false, f.fondo || 'transparent');

  const previos = new Set(editor.querySelectorAll('[style*="xxx-large"], font[size="7"]'));
  document.execCommand('fontSize', false, '7');
  editor.querySelectorAll('[style*="xxx-large"], font[size="7"]').forEach(n => {
    if (previos.has(n)) return;
    if (n.tagName === 'FONT') n.removeAttribute('size');

editor.addEventListener('mouseup', () => { if (formatoCopiado) setTimeout(aplicarBrocha, 0); });

/* ================= abrir archivos ================= */
$('archivo').addEventListener('change', e => { if (e.target.files[0]) abrirArchivo(e.target.files[0]); });

async function abrirArchivo(file, sinConfirmar = false){
  const ext = file.name.split('.').pop().toLowerCase();
  if (!window.mytext) archivoHandle = null;
  if (!sinConfirmar && editor.innerText.trim() && !confirm('¿Abrir "' + file.name + '"? Se reemplazará el contenido actual.')) return;
  try {
    cargando(true, 'Abriendo ' + file.name + '…');
    let html;
    if (ext === 'pdf'){ await abrirVisorPdf(file); aviso('Abierto: ' + file.name); return true; }
    if (visor.activo) cerrarVisorPdf(true, true);
    if (ext === 'pdf') html = await leerPdf(file);
    else if (ext === 'docx') html = await leerDocx(file);
    else if (ext === 'doc' || ext === 'dot') html = await leerDoc(file);
    else if (ext === 'odt') html = await leerOdt(file);
    else {
      const texto = await file.text();
      if (ext === 'html' || ext === 'htm'){
        html = extraerCuerpo(texto);
        // Títulos: aplicar su formato (de la hoja de estilos del archivo) como estilo en línea, para adoptarlo
        const reglas = {}; texto.replace(/body h([123])\{([^}]*)\}/g, (m, n, d) => { reglas[n] = d; });
        if (Object.keys(reglas).length){ const t = document.createElement('div'); t.innerHTML = html; t.querySelectorAll('h1,h2,h3').forEach(h => { const d = reglas[h.tagName[1]]; if (d) h.innerHTML = `<span style="${d.replace(/"/g, "'")}">${h.innerHTML}</span>`; }); html = t.innerHTML; }
      }
      else if (ext === 'rtf') html = rtfAHtml(texto);
      else if (ext === 'md' || ext === 'markdown') html = markdownAHtml(texto);
      else html = textoAHtml(texto);
    }
    editor.innerHTML = html || '<p><br></p>';
    colocarImagenesLeidas();
    quitarNumerosEscritos();
    if (ext !== 'docx') adoptarFormatoTitulos(true);   // (en Word lo hace el propio lector con los estilos del documento)
    normalizarSaltos(); limpiarTitulos();
    nombreDoc.value = file.name.replace(/\.[^.]+$/, '');
    actualizar(); $('zona').scrollTop = 0;
    if (!window.mytext) $('estadoGuardado').textContent = '';
    aviso('Abierto: ' + file.name);
    return true;
  } catch(err){
    console.error(err);
    alert('No se pudo abrir el archivo.\n\n' + err.message);
  } finally { cargando(false); }
}
// Al reabrir un documento exportado, quita los números de título escritos (ya los pone el editor)
function quitarNumerosEscritos(){
  editor.querySelectorAll('.num-titulo').forEach(n => n.remove());
  if (!numerarTitulos) return;
  editor.querySelectorAll('h1,h2,h3').forEach(h => {
    const tw = document.createTreeWalker(h, NodeFilter.SHOW_TEXT); const t = tw.nextNode();
    if (t) t.nodeValue = t.nodeValue.replace(/^\s*\d+(\.\d+)*\.?[\s\u00a0]+/, '');
  });
}
// Convierte saltos de página de otros formatos al salto del editor
function normalizarSaltos(){
  editor.querySelectorAll('[style*="page-break-after"],[style*="page-break-before"],[style*="break-after: page"],.pdf-pagina').forEach(el => {
    if (el.classList.contains('salto-pagina')) return;
    const st = el.getAttribute('style') || '';
    const s = document.createElement('div'); s.className = 'salto-pagina'; s.contentEditable = 'false';
    if (el.classList.contains('pdf-pagina') || !el.textContent.trim()) { el.replaceWith(s); return; }
    const raiz = bloqueRaiz(el) || el;
    if (/page-break-before/.test(st)) raiz.before(s); else raiz.after(s);
  });
  editor.querySelectorAll('.salto-pagina').forEach(s => {
    s.contentEditable = 'false'; s.removeAttribute('style');
    if (s.parentNode !== editor){ const r = bloqueRaiz(s); if (r) r.after(s); }
  });
}

function extraerCuerpo(texto){
  const doc = new DOMParser().parseFromString(texto, 'text/html');
  doc.querySelectorAll('script,style,link,meta,iframe,object,embed,title').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name)) n.removeAttribute(a.name); }));
  return doc.body.innerHTML;
}

/* PDF: extrae el texto agrupado en líneas, párrafos y títulos; cada página del PDF = una página */
async function leerPdf(file){
  await cargarScript(CDN.pdfjs);
  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfjsWorker;
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let html = '', totalTexto = 0;
  for (let n = 1; n <= pdf.numPages; n++){
    cargando(true, `Leyendo PDF… página ${n} de ${pdf.numPages}`);
    const pagina = await pdf.getPage(n);
    const anchoPag = pagina.getViewport({scale:1}).width;
    const contenido = await pagina.getTextContent();
    const lineas = [];
    for (const it of contenido.items){
      if (!it.str) continue;
      const x = it.transform[4], y = it.transform[5];
      const alto = Math.abs(it.transform[3]) || it.height || 10;
      let l = lineas.find(l => Math.abs(l.y - y) < alto * 0.5);
      if (!l){ l = {y, alto, trozos: []}; lineas.push(l); }
      l.alto = Math.max(l.alto, alto);
      const familia = contenido.styles[it.fontName]?.fontFamily || '';
      l.trozos.push({x, ancho: it.width, str: it.str, negrita: /bold|black|heavy/i.test(it.fontName + ' ' + familia)});
    }
    lineas.sort((a, b) => b.y - a.y);
    lineas.forEach(l => l.trozos.sort((a, b) => a.x - b.x));
    const conteo = {};
    lineas.forEach(l => { const k = Math.round(l.alto); conteo[k] = (conteo[k] || 0) + l.trozos.length; });
    const normal = +Object.keys(conteo).sort((a, b) => conteo[b] - conteo[a])[0] || 10;

    let parrafo = [], ultimoY = null, ultimoAlto = normal, ultimoTam = 0;
    const cerrar = () => {
      if (!parrafo.length) return;
      const t = parrafo.join(' ').replace(/\s+/g,' ').replace(/(\w)- (\w)/g,'$1$2').trim();
      if (t){
        totalTexto += t.length;
        if (ultimoTam >= normal * 1.6) html += `<h1>${t}</h1>`;
        else if (ultimoTam >= normal * 1.25) html += `<h2>${t}</h2>`;
        else html += `<p>${t}</p>`;
      }
      parrafo = [];
    };
    for (const l of lineas){
      const tam = Math.round(l.alto), esTitulo = tam >= normal * 1.25;
      let texto = '', finAnterior = null;
      for (const t of l.trozos){
        if (finAnterior !== null && t.x - finAnterior > l.alto * 0.25 && !texto.endsWith(' ') && !t.str.startsWith(' ')) texto += ' ';
        texto += t.negrita && !esTitulo ? '<b>' + escapar(t.str) + '</b>' : escapar(t.str);
        finAnterior = t.x + t.ancho;
      }
      texto = texto.replace(/<\/b>(\s*)<b>/g, '$1');
      const salto = ultimoY === null ? 0 : ultimoY - l.y;
      const plano = texto.replace(/<[^>]+>/g,'');
      if (ultimoY === null || salto > ultimoAlto * 1.75 || Math.abs(tam - ultimoTam) > 1.5 || /^\s*([•·▪\-–]|\d+[.)])\s/.test(plano)) cerrar();
      parrafo.push(texto);
      ultimoY = l.y; ultimoAlto = l.alto; ultimoTam = tam;
      const ult = l.trozos[l.trozos.length - 1];
      if (ult.x + ult.ancho < anchoPag * 0.6 && /[.:!?»"]\s*$/.test(plano)) cerrar();
    }
    cerrar();
    if (n < pdf.numPages) html += '<div class="salto-pagina" contenteditable="false"></div>';
  }
  if (totalTexto < 20) throw new Error('Este PDF no contiene texto seleccionable (probablemente es un documento escaneado o una imagen). Haría falta OCR para poder editarlo.');
  return html;
}


/* Word 97-2003 (.doc). Muchos ".doc" son en realidad RTF, HTML o .docx renombrados: se detecta por el contenido */
async function leerDoc(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const inicio = new TextDecoder('latin1').decode(buf.slice(0, 600)).toLowerCase();
  if (buf[0] === 0x50 && buf[1] === 0x4B) return leerDocx(file);                                 // .docx renombrado
  if (inicio.startsWith('{\\rtf')) return rtfAHtml(new TextDecoder('windows-1252').decode(buf));   // RTF
  if (/^mime-version:|multipart\/related/.test(inicio)){                                             // .doc "página web de un solo archivo"
    const h = mhtAHtml(new TextDecoder('latin1').decode(buf)); if (h !== null) return h;
  }
  if (/<html|<!doctype html|<body|xmlns:w=/.test(inicio)){                                          // HTML de Word
    let texto = new TextDecoder('utf-8').decode(buf);
    if (texto.includes('�')) texto = new TextDecoder('windows-1252').decode(buf);
    return extraerCuerpo(texto);
  }
  if (!(buf[0] === 0xD0 && buf[1] === 0xCF && buf[2] === 0x11 && buf[3] === 0xE0)) return textoAHtml(new TextDecoder('windows-1252').decode(buf));
  return docBinarioAHtml(buf);
}

function mhtAHtml(texto){
  const lim = (texto.match(/boundary="?([^";\r\n]+)"?/i) || [])[1];
  if (!lim) return null;
  const partes = texto.split('--' + lim).slice(1);
  let html = null; const recursos = {};
  for (const parte of partes){
    const corte = parte.search(/\r?\n\r?\n/); if (corte < 0) continue;
    const cab = parte.slice(0, corte), cuerpo = parte.slice(corte).trim();
    const tipo = ((cab.match(/Content-Type:\s*([^;\r\n]+)/i) || [])[1] || '').toLowerCase();
    const cod = ((cab.match(/Content-Transfer-Encoding:\s*([^\r\n]+)/i) || [])[1] || '').trim().toLowerCase();
    const loc = ((cab.match(/Content-Location:\s*([^\r\n]+)/i) || [])[1] || '').trim();
    const cs = ((cab.match(/charset="?([^";\r\n]+)"?/i) || [])[1] || 'utf-8').toLowerCase();
    let datos;
    if (cod === 'base64') datos = b64aBytes(cuerpo.replace(/\s+/g, ''));
    else if (cod === 'quoted-printable'){ const t = cuerpo.replace(/=\r?\n/g, ''); const u = []; for (let i = 0; i < t.length; i++){ if (t[i] === '=' && /^[0-9A-F]{2}$/i.test(t.substr(i + 1, 2))){ u.push(parseInt(t.substr(i + 1, 2), 16)); i += 2; } else u.push(t.charCodeAt(i) & 255); } datos = new Uint8Array(u); }
    else datos = new TextEncoder().encode(cuerpo);
    if (tipo === 'text/html' && html === null){ try { html = new TextDecoder(cs).decode(datos); } catch(e){ html = new TextDecoder('utf-8').decode(datos); } }
    else if (tipo.startsWith('image/') && loc){
      let bin = ''; for (let i = 0; i < datos.length; i += 0x8000) bin += String.fromCharCode.apply(null, datos.subarray(i, i + 0x8000));
      recursos[loc.split('/').pop().toLowerCase()] = `data:${tipo};base64,${btoa(bin)}`;
    }
  }
  if (html === null) return null;
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('img').forEach(i => { const k = (i.getAttribute('src') || '').split('/').pop().toLowerCase(); if (recursos[k]) i.setAttribute('src', recursos[k]); });
  doc.querySelectorAll('br[style*="page-break"]').forEach(b => { const d = doc.createElement('div'); d.className = 'salto-pagina'; b.replaceWith(d); });
  const sec = doc.querySelector('.WordSection1'); if (sec) sec.replaceWith(...sec.childNodes);
  return extraerCuerpo(doc.documentElement.outerHTML);
}

function iniciarMovimiento(e, img){
  const x0 = e.clientX, y0 = e.clientY, abs = img.style.position === 'absolute';
  const l0 = parseFloat(img.style.left) || 0, t0 = parseFloat(img.style.top) || 0;
  let moviendo = false, rango = null;
  const cur = $('cursorSoltar');
  const mover = ev => {
    if (!moviendo && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return;
    if (!moviendo){ moviendo = true; if (!abs) img.classList.add('arrastrando'); }
    if (abs){
      img.style.left = Math.round(l0 + (ev.clientX - x0) / escala) + 'px';
      img.style.top = Math.round(t0 + (ev.clientY - y0) / escala) + 'px';

    } else {
      rango = rangoEnPunto(ev.clientX, ev.clientY);
      if (rango && editor.contains(rango.startContainer)){
        let rc = rango.getClientRects()[0] || rango.getBoundingClientRect();
        if (!rc || (!rc.height && rango.startContainer.nodeType === 1)){ const n = rango.startContainer.childNodes[rango.startOffset] || rango.startContainer; rc = (n.nodeType === 1 ? n : n.parentElement).getBoundingClientRect(); }
        Object.assign(cur.style, {display: 'block', left: rc.left + 'px', top: rc.top + 'px', height: Math.max(rc.height, 18) + 'px'});
      } else { rango = null; cur.style.display = 'none'; }
    }
  };
  const soltar = () => {
    document.removeEventListener('pointermove', mover); document.removeEventListener('pointerup', soltar); document.removeEventListener('pointercancel', soltar);
    cur.style.display = 'none'; img.classList.remove('arrastrando');
    if (!moviendo) return;
    if (!abs && rango && editor.contains(rango.startContainer) && !img.contains(rango.startContainer)){
      const padre = img.parentElement;
      img.remove();
      if (padre && padre !== editor && estaVacio(padre)) padre.innerHTML = '<br>';
      let destino = rango;
      if (destino.startContainer === editor){ const p = document.createElement('p'); editor.insertBefore(p, editor.childNodes[destino.startOffset] || null); p.appendChild(img); }
      else destino.insertNode(img);
    }
    actualizar(); seleccionarImagen(img);
  };
  document.addEventListener('pointermove', mover); document.addEventListener('pointerup', soltar); document.addEventListener('pointercancel', soltar);
}

/* ================= buscar y reemplazar ================= */
let coincidencias = [], indiceBusq = -1;
function abrirBuscador(){
  $('buscador').classList.add('visible');
  const sel = window.getSelection().toString();
  if (sel && sel.length < 100) $('txtBuscar').value = sel;
  $('txtBuscar').focus(); $('txtBuscar').select(); resaltar();
}
function quitarResaltado(){
  editor.querySelectorAll('mark.encontrado').forEach(m => { const p = m.parentNode; m.replaceWith(...m.childNodes); p.normalize(); });
  coincidencias = []; indiceBusq = -1;
}
function resaltar(){
  quitarResaltado();
  const q = $('txtBuscar').value;
  if (!q){ $('infoBuscar').textContent = ''; return; }
  const qMin = q.toLowerCase();
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  const nodos = []; while (walker.nextNode()) nodos.push(walker.currentNode);
  for (const nodo of nodos){
    let pos, actual = nodo;
    while ((pos = actual.nodeValue.toLowerCase().indexOf(qMin)) !== -1){
      const m = actual.splitText(pos); const resto = m.splitText(q.length);
      const mark = document.createElement('mark'); mark.className = 'encontrado';
      m.replaceWith(mark); mark.appendChild(m);
      coincidencias.push(mark); actual = resto;
    }
  }
  $('infoBuscar').textContent = coincidencias.length ? coincidencias.length + ' coincidencias' : 'Sin coincidencias';
  if (coincidencias.length) irA(0);
}
function irA(i){
  coincidencias.forEach(m => m.classList.remove('actual'));
  indiceBusq = (i + coincidencias.length) % coincidencias.length;
  const m = coincidencias[indiceBusq]; m.classList.add('actual');
  m.scrollIntoView({block:'center', behavior:'smooth'});
  $('infoBuscar').textContent = `${indiceBusq + 1} de ${coincidencias.length}`;
}
$('txtBuscar').addEventListener('input', resaltar);
$('txtBuscar').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); if (coincidencias.length) irA(indiceBusq + 1); } });
$('btnSiguiente').onclick = () => coincidencias.length && irA(indiceBusq + 1);
$('btnReemplazar').onclick = () => {
  if (indiceBusq < 0) return;
  coincidencias[indiceBusq].replaceWith(document.createTextNode($('txtReemplazar').value));
  coincidencias.splice(indiceBusq, 1);
  if (coincidencias.length) irA(indiceBusq); else $('infoBuscar').textContent = 'Sin más coincidencias';
  actualizar();
};
$('btnReemplazarTodo').onclick = () => {
  const n = coincidencias.length;
  coincidencias.forEach(m => m.replaceWith(document.createTextNode($('txtReemplazar').value)));
  coincidencias = []; indiceBusq = -1; editor.normalize();
  $('infoBuscar').textContent = n + ' reemplazos'; actualizar();
};
function cerrarBuscador(){ quitarResaltado(); $('buscador').classList.remove('visible'); editor.focus(); }

// Ediciones guardadas por MyText dentro del PDF: permiten volver a editar el texto ya cambiado
async function leerEdicionesPdf(pdf){
  try {
    const md = await pdf.getMetadata();
    const raw = md && md.info && md.info.Custom && md.info.Custom.MyTextEdiciones;
    const v = raw ? JSON.parse(raw) : [];
    return Array.isArray(v) ? v : [];
  } catch(e){ return []; }
}
async function cargarPaginasPdf(bytes){
  const pdf = await pdfjsLib.getDocument({data: bytes.slice()}).promise;
  const paginas = [];
  for (let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const v = page.getViewport({scale: 1});
    paginas.push({n: i, page, w: v.width, h: v.height, texto: null, lineas: null});
  }
  return {pdf, paginas, ediciones: await leerEdicionesPdf(pdf)};
}
async function abrirVisorPdf(file){
  await cargarScript(CDN.pdfjs);
  pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfjsWorker;
  const bytes = new Uint8Array(await file.arrayBuffer());
  const {pdf, paginas, ediciones} = await cargarPaginasPdf(bytes);
  if (visor.pdf) try { visor.pdf.destroy(); } catch(e){}
  Object.assign(visor, {activo:true, pdf, bytes, nombre:file.name, paginas, ediciones, editando:false, anadiendo:false, cambios:false});
  document.body.classList.add('modo-pdf'); document.body.classList.remove('pdf-editando', 'pdf-anadiendo');
  $('vpNombre').textContent = file.name; $('vpNombre').title = file.name;
  nombreDoc.value = file.name.replace(/\.[^.]+$/, '');
  editor.innerHTML = '';
  deseleccionarImagen && deseleccionarImagen();
  ponerPaginaCss();
  visor.escala = escalaAjustada();
  maquetarPaginas();

function familiaDe(p, fontName){
  const fam = ((p.texto.styles[fontName] || {}).fontFamily || '') + ' ' + fontName;
  return /mono|courier/i.test(fam) ? 'monospace' : /serif|times|roman|georgia|garamond|book/i.test(fam) && !/sans/i.test(fam) ? 'serif' : 'sans-serif';

const tapada = (ed, x, y) => x >= ed.x - 1 && x <= ed.x + ed.w + 1 && y >= ed.y - ed.size * 0.3 && y <= ed.y + ed.size * 0.9;
function lineasPagina(p){
  if (p.lineas) return p.lineas;
  const eds = (visor.ediciones || []).filter(e => e.pag === p.n);
  const items = [];
  for (const it of p.texto.items){
    if (!it.str || !it.str.trim()) continue;   // los espacios se deducen por la distancia entre palabras
    const [a, b, c, d, e, f] = it.transform;
    if (Math.abs(b) > 0.01 || Math.abs(c) > 0.01) continue;     // texto girado: no editable
    const size = Math.abs(d) || Math.abs(a); if (!size) continue;
    if (eds.some(ed => tapada(ed, e, f))) continue;              // texto antiguo ya sustituido por MyText
    items.push({x: e, y: f, w: it.width, size, str: it.str, font: it.fontName});
  }
  items.sort((m, n) => (n.y - m.y) || (m.x - n.x));
  const lineas = [];
  for (const it of items){
    const l = lineas[lineas.length - 1];
    const gap = l ? it.x - (l.x + l.w) : 0;
    if (l && Math.abs(l.y - it.y) < it.size * 0.3 && Math.abs(l.size - it.size) < 1.2 && gap > -it.size * 0.5 && gap < it.size * 0.7){
      if (gap > it.size * 0.15 && !l.original.endsWith(' ') && !it.str.startsWith(' ')) l.original += ' ';
      l.original += it.str; l.w = Math.max(l.w, it.x + it.w - l.x);
      if (/bold|black|heavy|semibold/i.test(it.font)) l.negrita = true;
    } else {
      lineas.push({pag: p.n, x: it.x, y: it.y, w: it.w, size: it.size, original: it.str, font: it.font,
        familia: familiaDe(p, it.font), negrita: /bold|black|heavy|semibold/i.test(it.font), cursiva: /italic|oblique/i.test(it.font)});
    }
  }
  p.lineas = lineas.filter(l => l.original.trim()).map(l => ({...l, original: l.original.replace(/\s+$/, ''), texto: l.original.replace(/\s+$/, ''), editada: false}));
  // Las líneas editadas antes con MyText aparecen como texto normal, listo para volver a editar
  eds.forEach(ed => { if (ed.texto) p.lineas.push({pag: p.n, x: ed.x, y: ed.y, w: ed.w, size: ed.size, original: ed.texto, texto: ed.texto, familia: ed.familia, negrita: ed.negrita, cursiva: ed.cursiva, editada: false, deMyText: true}); });
  return p.lineas;
}
function crearLineaEl(p, v, l){
  const [vx, vy] = v.convertToViewportPoint(l.x, l.y);

  const el = document.createElement('div');
  el.className = 'vlinea' + (l.editada ? ' editada' : '') + (l.nueva ? ' nueva' : '');
  el.contentEditable = 'true'; el.spellcheck = true; el.lang = 'es';
  Object.assign(el.style, {
    left: (vx - 1) + 'px', top: (vy - fs * 0.92) + 'px', fontSize: fs + 'px', fontFamily: l.familia,
    fontWeight: l.negrita ? '700' : '400', fontStyle: l.cursiva ? 'italic' : 'normal',
    minWidth: (l.nueva ? 40 : l.w * visor.escala + 2) + 'px', height: (fs * 1.15) + 'px'
  });
  el.textContent = l.texto;
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === 'Escape'){ e.preventDefault(); el.blur(); }
    if (!e.ctrlKey && !e.metaKey && !e.altKey) e.stopPropagation();   // los atajos (Ctrl+S…) siguen funcionando

async function exportarPdfEditado(){
  if (!visor.activo) return;
  try {
    cargando(true, 'Guardando PDF…');
    await cargarScript(CDN.pdflib);
    const {PDFDocument, StandardFonts, rgb, PDFName, PDFHexString} = PDFLib;
    const ediciones = new Map((visor.ediciones || []).map(e => [e.pag + ':' + Math.round(e.x) + ':' + Math.round(e.y), e]));
    const doc = await PDFDocument.load(visor.bytes.slice(), {ignoreEncryption: true});
    const cache = {};
    const fuente = async l => {
      const base = l.familia === 'serif' ? 'TimesRoman' : l.familia === 'monospace' ? 'Courier' : 'Helvetica';
      const suf = (l.negrita ? 'Bold' : '') + (l.cursiva ? (base === 'TimesRoman' ? 'Italic' : 'Oblique') : '');
      const k = base + suf;
      return cache[k] || (cache[k] = await doc.embedFont(StandardFonts[k] || StandardFonts[base]));
    };
    const limpiar = (t, f) => [...t].map(ch => { try { f.encodeText(ch); return ch; } catch(e){ return '?'; } }).join('');
    let n = 0;
    for (const p of visor.paginas){
      if (!p.lineas) continue;
      const pagina = doc.getPage(p.n - 1);
      for (const l of p.lineas){
        if (!l.editada) continue;
        if (!l.nueva || l.deMyText) pagina.drawRectangle({x: l.x - 0.6, y: l.y - l.size * 0.24, width: l.w + 1.2, height: l.size * 1.14, color: rgb(1, 1, 1)});
        let ancho = l.w;
        if (l.texto.trim()){ const f = await fuente(l); const t = limpiar(l.texto, f); pagina.drawText(t, {x: l.x, y: l.y, size: l.size, font: f, color: rgb(0, 0, 0)}); ancho = Math.max(ancho, f.widthOfTextAtSize(t, l.size)); }
        const k = p.n + ':' + Math.round(l.x) + ':' + Math.round(l.y);
        const prev = ediciones.get(k);
        ediciones.set(k, {pag: p.n, x: l.x, y: l.y, w: Math.max(ancho, prev ? prev.w : 0), size: l.size, texto: l.texto, familia: l.familia, negrita: !!l.negrita, cursiva: !!l.cursiva});
        n++;
      }
    }
    const lista = [...ediciones.values()];
    try { doc.getInfoDict().set(PDFName.of('MyTextEdiciones'), PDFHexString.fromText(JSON.stringify(lista))); } catch(e){}
    const salida = await doc.save();
    cargando(false);
    const ok = await descargar(new Blob([salida], {type: 'application/pdf'}), nombreBase() + '.pdf');
    if (ok !== false){
      // Mostrar el PDF tal como ha quedado guardado
      const editando = visor.editando;
      const nuevo = await cargarPaginasPdf(salida);
      try { visor.pdf.destroy(); } catch(e){}
      Object.assign(visor, {pdf: nuevo.pdf, paginas: nuevo.paginas, ediciones: nuevo.ediciones.length ? nuevo.ediciones : lista, bytes: salida, cambios: false});
      if (editando) for (const pg of visor.paginas) pg.texto = await pg.page.getTextContent();
      rehacerPaginas();
    }
    return ok;
  } catch(e){
    cargando(false); console.error(e);
    alert('No se pudo guardar el PDF.\n\n' + e.message);
    return false;
  }
}

      esperando = res;
      setTimeout(() => { if (esperando === res){ esperando = null; destinoDirecto = null; res(false); } }, 120000);
      Promise.resolve(acciones[accion]()).then(r => { if (r === false && esperando === res){ esperando = null; destinoDirecto = null; res(false); } }).catch(() => { if (esperando === res){ esperando = null; res(false); } });
    });
  }
  const tieneFormato = ext => !!editor.querySelector(ext === 'md' ? 'u,span[style*="color"],span[style*="font-size"],span[style*="background"],font,img' : 'b,strong,i,em,u,s,span[style],font,img,table,h1,h2,h3,ul,ol,a,blockquote');
  // Guardar: escribe en el mismo archivo y con el mismo formato. Solo un documento nuevo pregunta dónde guardarlo.
  async function guardar(){
    const ext = ruta ? extDe(ruta) : null;
    if (visor.activo){
      if (!visor.cambios){ aviso('No hay cambios que guardar en el PDF'); return true; }
      return guardarConFormato('guardar-pdf-editado', ext === 'pdf' ? ruta : null);
    }
    if (ruta && ext === 'pdf'){     // un PDF convertido a documento: se vuelve a guardar como PDF
      if (!M.elegirRuta) return guardarComo();
      if (!avisadoFormato[ruta]){
        if (!confirm(`Se sobrescribirá "${nombreDe(ruta)}" con el documento tal como se ve en MyText; el diseño original del PDF se perderá.\n\n¿Continuar? (Cancelar = elegir otro nombre o formato)`)) return guardarComo();
        avisadoFormato[ruta] = true;
      }
      const r = await M.pdf(nombreDe(ruta), ruta);
      if (r){ ponerModificado(false); aviso('Guardado: ' + nombreDe(r)); }
      return !!r;
    }
    if (ruta && ESCRIBIBLES[ext]){
      if ((ext === 'txt' || ext === 'md') && tieneFormato(ext) && !avisadoFormato[ruta]){
        avisadoFormato[ruta] = true;
        if (!confirm(`El formato .${ext} no guarda ${ext === 'txt' ? 'negritas, colores, títulos, tablas ni imágenes' : 'colores, tamaños de letra ni imágenes'}.\n\n¿Guardar igualmente en "${nombreDe(ruta)}"?\n\n(Cancelar = elegir otro formato con "Guardar como")`)) return guardarComo();
      }
      return guardarConFormato(ESCRIBIBLES[ext], ruta);
    }
    return guardarComo();   // documento nuevo: elegir nombre, carpeta y formato
  }
  const avisadoFormato = {};
  // Guardar como: elegir nombre, carpeta y formato
  const ACCION_POR_EXT = {...ESCRIBIBLES, pdf: 'pdf'};
  async function guardarComo(){
    if (!M.elegirRuta) return guardarConFormato(visor.activo ? 'guardar-pdf-editado' : 'guardar-docx');   // programa antiguo
    const extActual = visor.activo ? 'pdf' : (ruta && ACCION_POR_EXT[extDe(ruta)] ? extDe(ruta) : 'docx');
    const r = await M.elegirRuta(nombreBase() + '.' + extActual, extActual, visor.activo);
    if (!r) return false;
    const ext = extDe(r);
    if (ext === 'pdf'){
      if (visor.activo) return guardarConFormato('guardar-pdf-editado', r);
      const ok = await M.pdf(nombreDe(r), r);
      if (ok) aviso('PDF guardado: ' + nombreDe(ok) + ' (el documento sigue siendo "' + (ruta ? nombreDe(ruta) : nombreDoc.value) + '")', 4500);
      return !!ok;
    }
    if (visor.activo){ aviso('Un PDF solo se puede guardar como PDF. Para otros formatos usa «Convertir a documento».', 5000); return false; }
    return guardarConFormato(ACCION_POR_EXT[ext] || 'guardar-docx', r);
  }
  window.__mytextMarcarCambio = () => { editadoSesion = true; ponerModificado(true); };
  window.__mytextReiniciar = () => { ruta = null; ponerModificado(false); };
  window.__mytextGuardar = guardar;
  if (M.nuevaVentana) document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'n'){ e.preventDefault(); acciones.nuevo(); }
  });
  window.__mytextGuardarAtajo = shift => shift ? guardarComo() : guardar();

  // PDF con el motor de impresión del programa (texto real, no imagen)
  acciones['guardar-pdf'] = async () => { const r = await M.pdf(nombreBase() + '.pdf'); if (r) aviso('PDF guardado: ' + nombreDe(r)); };

  // Abrir y nuevo. Con el programa 1.0.1 o posterior, la pregunta "¿Guardar cambios?" la hace el programa (Guardar / No guardar / Cancelar)
  const preguntaPrograma = typeof M.confirmarCambios === 'function';
  const hayCambios = () => window.__mytextModificado && editadoSesion;
  const descartarCambios = async () => {
    if (preguntaPrograma) return M.confirmarCambios();
    return !hayCambios() || confirm('Hay cambios sin guardar. ¿Descartarlos?');
  };
  window.__mytextHayCambios = () => !!window.__mytextModificado;
  window.__mytextRuta = () => ruta;
  window.__mytextVacio = () => !visor.activo && !ruta && !window.__mytextModificado && !editor.textContent.trim() && !editor.querySelector('img,table,hr');
  acciones.abrir = async () => { if (preguntaPrograma || await descartarCambios()) M.abrir(); };
  acciones.nuevo = async () => {
    if (M.nuevaVentana && !window.__mytextVacio()){ M.nuevaVentana(); return; }   // como en Word: otra ventana
    if (!(await descartarCambios())) return;
    if (visor.activo) cerrarVisorPdf(true, true);
    silencio++; editor.innerHTML = ''; nombreDoc.value = 'Documento sin título'; actualizar(); silencio--;
    ruta = null; ponerModificado(false); editor.focus();
  };
  // Arrastrar un archivo a la ventana: se abre con su ruta, para que "Guardar" escriba en él
  const abrirArchivoOriginal = abrirArchivo;
  abrirArchivo = async function(file, sinConfirmar){
    if (!sinConfirmar){
      const r = M.rutaDe(file);
      if (r){ if (preguntaPrograma || await descartarCambios()) M.abrirRuta(r); return false; }
      if (!(await descartarCambios())) return false;
      silencio++; const ok = await abrirArchivoOriginal(file, true); silencio--;
      if (ok){ ruta = null; ponerModificado(true); }
      return ok;
    }
    return abrirArchivoOriginal(file, true);
  };
  M.alAbrirArchivo(async d => {
    // d.forzar: el programa ya ha preguntado. Si no, solo se pregunta si hubo cambios reales en esta sesión
    if (!d.forzar && hayCambios() && !confirm('Hay cambios sin guardar en el documento actual. ¿Descartarlos y abrir "' + d.nombre + '"?')) return;
    const file = new File([d.datos], d.nombre);
    silencio++;
    const ok = await abrirArchivoOriginal(file, true);
    silencio--;
    if (ok){ ruta = d.ruta; titulo(); ponerModificado(false); nombreDoc.value = d.nombre.replace(/\.[^.]+$/, ''); }
  });

  // Menú Archivo: Guardar, Guardar como, Recientes
  const opcArchivo = document.querySelector('.desplegable .opciones');
  opcArchivo.insertAdjacentHTML('afterbegin', `
    <button id="mtNuevo">Nuevo <kbd>${M.nuevaVentana ? 'Ctrl+N' : 'Ctrl+Alt+N'}</kbd></button>
    <button id="mtAbrir">Abrir… <kbd>Ctrl+O</kbd></button>
    <div id="listaRecientes"></div>
    <hr>
    <button id="mtGuardar">Guardar <kbd>Ctrl+S</kbd></button>
    <button id="mtGuardarComo">Guardar como… <kbd>Ctrl+Mayús+S</kbd></button>
    <hr>`);
  // quitar los Nuevo/Abrir originales (ya están arriba) y el atajo duplicado de Word
  opcArchivo.querySelectorAll('[data-accion="nuevo"],[data-accion="abrir"],.solo-web').forEach(b => b.remove());
  const btnDocx = opcArchivo.querySelector('[data-accion="guardar-docx"] kbd'); if (btnDocx) btnDocx.remove();
  opcArchivo.querySelectorAll('[data-accion^="guardar-"]').forEach(b => { b.childNodes[0].nodeValue = b.childNodes[0].nodeValue.replace('Guardar como', 'Exportar a'); });
  const clic = (id, fn) => { const b = $(id); b.addEventListener('mousedown', e => e.preventDefault()); b.addEventListener('click', fn); };
  clic('mtNuevo', () => acciones.nuevo());
  clic('mtAbrir', () => acciones.abrir());
  clic('mtGuardar', () => guardar());
  clic('mtGuardarComo', () => guardarComo());
  // Las exportaciones del menú siempre preguntan dónde guardar
  opcArchivo.querySelectorAll('[data-accion^="guardar-"]').forEach(b => b.addEventListener('click', () => { destinoDirecto = null; }, true));

  document.querySelector('.desplegable > button').addEventListener('click', async () => {
    const lista = await M.recientes();
    const cont = $('listaRecientes');
    cont.innerHTML = lista.length ? '<div class="titulo-rec">Recientes</div>' : '';
    lista.slice(0, 6).forEach(r => {
      const b = document.createElement('button');
      b.innerHTML = `<span>${escapar(nombreDe(r))}</span>`; b.title = r;
      b.addEventListener('mousedown', e => e.preventDefault());
      b.addEventListener('click', async () => { if (preguntaPrograma || await descartarCambios()) M.abrirRuta(r); });
      cont.appendChild(b);
    });
  });

  // Menú Ver: actualizaciones y versión
  const opcVer = [...document.querySelectorAll('.desplegable')].find(d => d.querySelector(':scope > button').textContent.trim() === 'Ver').querySelector('.opciones');
  opcVer.insertAdjacentHTML('beforeend', `<hr><button id="mtBuscarAct">Buscar actualizaciones</button><button id="mtAcerca">Acerca de MyText</button>`);
  clic('mtBuscarAct', () => buscarActualizaciones(false));
  clic('mtAcerca', () => alert(`MyText\n\nPrograma: versión ${M.info.versionPrograma}\nEditor: versión ${M.info.versionEditor}`));

  // Aviso de actualización
  const banner = $('bannerAct');
  function mostrarBanner(r){
    let html = '';
    if (r.programa) html = `🎉 Hay una nueva versión del programa (${r.programa}). <button class="prim" id="mtActProg">Descargar e instalar</button>`;
    else if (r.editorNecesitaPrograma) html = `Hay una nueva versión del editor (${r.editorNecesitaPrograma}), pero necesita una versión más nueva del programa. Aún no está publicada.`;
    else if (r.editor) html = `✨ Hay una nueva versión del editor (${r.editor}). <button class="prim" id="mtActEd">Actualizar ahora</button>`;
    if (!html) return;
    banner.innerHTML = html + '<button class="sec" id="mtLuego">Más tarde</button><button class="cerrar" id="mtCerrarBanner">✕</button>';
    banner.classList.add('visible');
    const cerrar = () => banner.classList.remove('visible');
    $('mtLuego').onclick = cerrar; $('mtCerrarBanner').onclick = cerrar;
    if ($('mtActEd')) $('mtActEd').onclick = actualizarEditor;
    if ($('mtActProg')) $('mtActProg').onclick = async () => {
      banner.innerHTML = 'Descargando la actualización… <b id="mtProg">0%</b>';
      const res = await M.actualizarPrograma();
      if (!res.ok){ banner.innerHTML = 'No se pudo descargar: ' + escapar(res.error || '') + ' <button class="cerrar" id="mtCerrarBanner">✕</button>'; $('mtCerrarBanner').onclick = cerrar; }
    };
  }
  M.alProgreso(p => { const e = $('mtProg'); if (e) e.textContent = p + '%'; });
  async function actualizarEditor(){
    guardarAhora();
    saliendoPorActualizacion = true;
    try { localStorage.setItem(CLAVE.recarga, '1'); } catch(e){}
    banner.innerHTML = 'Actualizando el editor…';
    const res = await M.actualizarEditor();
    if (!res.ok){ saliendoPorActualizacion = false; try { localStorage.removeItem(CLAVE.recarga); } catch(e){} banner.innerHTML = 'No se pudo actualizar: ' + escapar(res.error || '') + ' <button class="cerrar" id="mtCerrarBanner">✕</button>'; $('mtCerrarBanner').onclick = () => banner.classList.remove('visible'); }
  }
  async function buscarActualizaciones(silencioso){
    if (!silencioso) aviso('Buscando actualizaciones…');
    const r = await M.buscarActualizaciones();
    if (r.programa || r.editor || r.editorNecesitaPrograma) mostrarBanner(r);
    else if (!silencioso) aviso(r.error ? r.error : `Tienes la última versión (programa ${M.info.versionPrograma}, editor ${M.info.versionEditor})`, 4000);
  }
  M.alHayActualizacion(mostrarBanner);

  // Guardar el estado al instante (antes de recargar el editor actualizado)
  function guardarAhora(){
    try {
      localStorage.setItem(CLAVE.contenido, limpioParaExportar(false, true));
      localStorage.setItem(CLAVE.nombre, nombreDoc.value);
    } catch(e){}
    guardarEstado();
  }

  // Al arrancar: recuperar el documento de la última sesión
  try {
    const est = window.__mytextSinRestaurar ? null : JSON.parse(localStorage.getItem(CLAVE.estado) || 'null');
    if (est){ ruta = est.ruta || null; window.__mytextModificado = !!est.modificado; }
  } catch(e){}
  silencio++; setTimeout(() => { silencio--; titulo(); }, 0);   // el arranque no cuenta como cambio
  titulo();
})();

/* ================= inicio ================= */
try { document.execCommand('styleWithCSS', false, true); document.execCommand('defaultParagraphSeparator', false, 'p'); } catch(e){}
try {
  if (localStorage.getItem('editor-oscuro')) document.body.classList.add('oscuro');
  if (localStorage.getItem('editor-indice') === '0') $('indice').classList.add('oculto');
  if (localStorage.getItem('editor-corrector') === '0'){ editor.spellcheck = false; $('txtCorrector').textContent = 'Corrector ortográfico: desactivado'; }
  const guardado = localStorage.getItem(CLAVE.contenido);
  if (guardado && !window.__mytextSinRestaurar){ editor.innerHTML = guardado; nombreDoc.value = localStorage.getItem(CLAVE.nombre) || nombreDoc.value; }
} catch(e){}
aplicarEstilos(false);
normalizarSaltos();
adoptarFormatoTitulos();
limpiarTitulos();
actualizar();
actualizarIndice();
let vistaPref = null; try { vistaPref = localStorage.getItem('editor-vista'); } catch(e){}
ponerVista(vistaPref ? vistaPref === 'movil' : esMovil(), false);
if (!esTactil()) editor.focus();
</script>
</body>
</html>
